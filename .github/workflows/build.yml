name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | tail -1)
          sudo xcode-select -s "${XCODE_PATH}"

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild build \
            -project StayWhereWindowsAre.xcodeproj \
            -scheme StayWhereWindowsAre \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project StayWhereWindowsAre.xcodeproj \
            -scheme StayWhereWindowsAre \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project StayWhereWindowsAre.xcodeproj \
            -scheme StayWhereWindowsAre \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package for download
        run: |
          mkdir -p dist
          cp -R build/DerivedData/Build/Products/Release/StayWhereWindowsAre.app dist/
          cp README.md dist/
          echo '安装方法：
          1. 把 StayWhereWindowsAre.app 拖到 "应用程序" 文件夹。
          2. 打开后系统会提示授权，在 系统设置 → 隐私与安全性 → 辅助功能 中打开开关。
          3. 如果想让它每次开机自启，右键程序坞上的图标 → 选项 → 登录时打开。

          如果没有辅助功能权限，App 会停留在"需要权限"状态，不会做任何事。' > dist/安装说明.txt
          (cd dist && zip -r ../StayWhereWindowsAre.zip .)
          echo "Artifact size: $(du -sh dist/StayWhereWindowsAre.zip | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StayWhereWindowsAre.zip
          path: StayWhereWindowsAre.zip