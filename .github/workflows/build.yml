name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | tail -1)
          echo "Using ${XCODE_PATH}"
          sudo xcode-select -s "${XCODE_PATH}"

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug)
        run: |
          xcodebuild build \
            -project StayWhereWindowsAre.xcodeproj \
            -scheme StayWhereWindowsAre \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -20

      - name: Run tests
        run: |
          xcodebuild test \
            -project StayWhereWindowsAre.xcodeproj \
            -scheme StayWhereWindowsAre \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -30

      - name: Build (Release)
        run: |
          xcodebuild build \
            -project StayWhereWindowsAre.xcodeproj \
            -scheme StayWhereWindowsAre \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -20

      - name: Package Artifact
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/StayWhereWindowsAre.app"
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/DerivedData/Build/Products/Release/StayWhereWindowsAre-unsigned.app
            echo "App size: $(du -sh "${APP_PATH}" | cut -f1)"
          fi

      - name: Upload App (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: StayWhereWindowsAre-unsigned
          path: build/DerivedData/Build/Products/Release/StayWhereWindowsAre-unsigned.app
          if-no-files-found: ignore